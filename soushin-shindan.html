<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>受付アプリ 送信診断</title>
<style>
body{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#eef2ec;color:#26302b;
 margin:0;padding:16px;line-height:1.7;}
h1{font-size:19px;margin:0 0 4px;} .lead{font-size:14px;color:#6b7a72;margin-bottom:16px;}
.card{background:#fff;border:1px solid #d8ded6;border-radius:12px;padding:16px;margin-bottom:14px;}
.card h2{font-size:15px;margin:0 0 10px;color:#00708f;}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px;}
input{width:100%;box-sizing:border-box;font-size:18px;padding:11px;border:2px solid #d8ded6;
 border-radius:8px;font-family:inherit;}
button{border:none;background:#00708f;color:#fff;border-radius:10px;padding:14px 24px;
 font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;width:100%;margin-top:14px;}
button:disabled{background:#9db3bb;}
pre{background:#1c2b3a;color:#e6edf3;border-radius:10px;padding:14px;font-size:13px;
 white-space:pre-wrap;word-break:break-all;margin:10px 0 0;line-height:1.6;}
.ok{color:#2e7d5b;font-weight:700;} .ng{color:#b3382e;font-weight:700;}
.hint{font-size:13px;color:#6b7a72;margin-top:10px;}
</style>
</head>
<body>
<h1>受付アプリ 送信診断</h1>
<div class="lead">受付記録がスプレッドシートに届かない原因を調べます。受付アプリと同じ場所（同じGitHub Pages）に置いて開いてください。</div>

<div class="card">
  <h2>1. 保存されている接続設定</h2>
  <label>ウェブアプリのURL</label>
  <input type="text" id="url" placeholder="https://script.google.com/macros/s/…/exec">
  <label>合言葉</label>
  <input type="text" id="key" placeholder="GASのWRITE_KEYまたはADMIN_KEY">
  <div class="hint" id="src"></div>
</div>

<div class="card">
  <h2>2. 診断を実行</h2>
  <button id="run" onclick="runAll()">診断する（テスト記録を1件送信します）</button>
  <pre id="out">ボタンを押すと結果が表示されます。</pre>
  <div class="hint">テスト記録は氏名「診断テスト」で送信されます。確認後はスプレッドシートから行を削除してください。</div>
</div>

<div class="card">
  <h2>3. 未送信の件数</h2>
  <pre id="q">―</pre>
</div>

<script>
const LS_URL="uketsuke_gas_url", LS_KEY="uketsuke_api_key", LS_Q="uketsuke_queue";
const $=id=>document.getElementById(id);

// 受付アプリが保存した設定を読み込む（同じ場所に置いた場合のみ）
const su=localStorage.getItem(LS_URL), sk=localStorage.getItem(LS_KEY);
if(su) $("url").value=su;
if(sk) $("key").value=sk;
$("src").textContent = su ? "受付アプリの設定を読み込みました。" :
  "受付アプリの設定が見つかりません。手で入力してください（別の場所に置いた場合はこうなります）。";

try{
  const q=JSON.parse(localStorage.getItem(LS_Q)||"[]");
  $("q").textContent = q.length===0 ? "未送信：0件" :
    "未送信："+q.length+"件\n\n最も古い1件:\n"+JSON.stringify(q[0],null,2);
}catch(e){ $("q").textContent="未送信キューを読めません: "+e; }

function log(t){ $("out").textContent += t+"\n"; }

async function runAll(){
  const url=$("url").value.trim(), key=$("key").value.trim();
  $("out").textContent=""; $("run").disabled=true;
  if(!url){ log("URLが空です。"); $("run").disabled=false; return; }

  log("URL末尾の確認: " + (url.endsWith("/exec") ? "OK（/execで終わっています）"
    : "★問題あり（/exec で終わっていません。/dev や余分な文字が付いていませんか）"));
  log("");

  // --- GET（接続テストと同じ） ---
  log("【1】接続テスト（GET）");
  try{
    const r=await fetch(url+"?type=ping&apiKey="+encodeURIComponent(key));
    const t=await r.text();
    log("  HTTP状態: "+r.status+" / 最終URL: "+(r.url||"―"));
    log("  応答: "+t.slice(0,300));
    try{ const j=JSON.parse(t);
      log("  判定: "+(j.status==="ok" ? "成功" : "失敗（"+(j.message||"理由不明")+"）"));
    }catch(e){ log("  判定: ★応答がJSONではありません（ログイン画面などが返っている可能性）"); }
  }catch(e){ log("  ★通信エラー: "+e.message); }
  log("");

  // --- POST（実際の受付送信と同じ） ---
  log("【2】受付記録の送信（POST）");
  const rec={ type:"checkin", apiKey:key, timestamp:new Date().toISOString(),
    category:"面会", name:"診断テスト", company:"", target:"診断テスト",
    floor:"本館2階", purpose:"", count:"1名",
    temp:"36.9度以下", symptom:"なし", flag:"" };
  try{
    const r=await fetch(url,{method:"POST",body:JSON.stringify(rec)});
    const t=await r.text();
    log("  HTTP状態: "+r.status+" / 最終URL: "+(r.url||"―"));
    log("  応答: "+t.slice(0,300));
    try{
      const j=JSON.parse(t);
      if(j.status==="ok"){
        log("  判定: 送信成功。スプレッドシートに1行増えているはずです。");
      }else{
        log("  判定: ★GASが受け付けませんでした（"+(j.message||"理由不明")+"）");
        if(j.message==="auth") log("        → 合言葉の不一致です。GASのADMIN_KEY / WRITE_KEY と照合してください。");
        if(j.message==="type") log("        → GASのコードが古い可能性があります。最新のcode.gsに差し替えてください。");
      }
    }catch(e){ log("  判定: ★応答がJSONではありません。GASの公開設定（アクセスできるユーザー＝全員）をご確認ください。"); }
  }catch(e){
    log("  ★通信エラー: "+e.message);
    log("        → 通信が遮断されています。施設内ネットワークの制限、またはGASの公開設定が原因の可能性があります。");
  }
  log("");
  log("この画面をそのまま撮影してお知らせください。");
  $("run").disabled=false;
}
</script>
</body>
</html>
